<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Soumendra Archive</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#080b12;--panel:#111722;--panel2:#151e2d;--line:#263246;--text:#eef3ff;--muted:#8b98ad;--blue:#77adff}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 90% 0,#182641 0,transparent 36%),var(--bg);color:var(--text);font:15px/1.5 system-ui,Segoe UI,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.layout{min-height:100vh;display:flex}.side{width:245px;flex-shrink:0;background:#0b1018;border-right:1px solid var(--line);padding:24px 16px}.brand{font-size:19px;font-weight:800;margin:5px 8px 28px;letter-spacing:.5px}.brand span{color:var(--blue)}.label{font-size:11px;letter-spacing:1.4px;color:var(--muted);margin:20px 8px 8px}.nav button{display:block;width:100%;text-align:left;background:transparent;border:0;color:#aebbd0;padding:11px;border-radius:10px}.nav button.active,.nav button:hover{background:#182337;color:white}.nav button.active{box-shadow:inset 2px 0 var(--blue)}main{width:100%;max-width:1500px;margin:auto;padding:30px clamp(15px,4vw,52px)}header{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:25px}.eyebrow{color:var(--blue);text-transform:uppercase;letter-spacing:1.5px;font-size:12px}.h1{font-size:clamp(27px,3vw,38px);margin:4px 0;font-weight:760}.muted{color:var(--muted)}.buttons{display:flex;gap:9px;flex-wrap:wrap}.btn{border:1px solid var(--line);background:#172131;color:white;padding:10px 14px;border-radius:10px;font-weight:600}.btn.primary{background:var(--blue);color:#06101f;border-color:transparent}.btn:disabled{opacity:.5}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:22px 0}.stat{background:linear-gradient(145deg,#141c29,#10151f);border:1px solid var(--line);padding:17px;border-radius:14px}.stat small{color:var(--muted)}.stat strong{display:block;font-size:25px;margin-top:4px}.toolbar{display:flex;gap:10px;margin:18px 0;flex-wrap:wrap}.search{flex:1;min-width:180px}.field{background:#101722;border:1px solid var(--line);color:white;padding:11px 12px;border-radius:10px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}.card{background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:16px;display:flex;flex-direction:column;min-height:180px}.card:hover{border-color:#3b5275;transform:translateY(-2px)}.icon{width:44px;height:44px;display:grid;place-items:center;background:#1a2537;border-radius:12px;font-size:21px;margin-bottom:12px}.card h3{font-size:15px;margin:0 0 5px;overflow-wrap:anywhere}.card p{font-size:12px;color:var(--muted);margin:0}.bottom{margin-top:auto;padding-top:14px;display:flex;justify-content:space-between;align-items:center;gap:8px}.tag{font-size:11px;color:#a6c8ff;border:1px solid #2d4566;border-radius:20px;padding:4px 8px}.card-actions{display:flex;gap:6px}.card-actions button{background:transparent;color:#aab7cb;border:1px solid var(--line);border-radius:7px;padding:5px 8px}.empty{border:1px dashed #344258;border-radius:15px;padding:40px;text-align:center;color:var(--muted);grid-column:1/-1}.modal{display:none;position:fixed;inset:0;background:#0009;z-index:5;align-items:center;justify-content:center;padding:18px}.modal.show{display:flex}.box{background:#121a26;border:1px solid #2c384b;border-radius:18px;padding:22px;width:min(500px,100%);max-height:90vh;overflow:auto}.box h2{margin:0 0 16px}.form{display:grid;gap:12px}.form label{font-size:12px;color:var(--muted);display:grid;gap:6px}.form input,.form select,.form textarea{width:100%;padding:11px;background:#0b111a;border:1px solid #2b3547;border-radius:9px;color:white}.form .row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.close{float:right;border:0;background:none;color:#aab7cb;font-size:24px}.status{padding:10px 12px;border-radius:10px;background:#142131;color:#a9c8f8;margin:12px 0;display:none}.status.show{display:block}.auth{max-width:460px;margin:8vh auto;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:24px}.auth h1{margin:0 0 8px}.footer{text-align:center;color:#69758a;font-size:12px;margin:30px}.mobile{display:none}@media(max-width:800px){.side{width:65px;padding:16px 6px}.brand{font-size:0;text-align:center;margin:8px 0 20px}.brand span{font-size:20px}.nav button{font-size:0;text-align:center;padding:12px}.nav button:before{content:'•';font-size:18px}.label{display:none}main{padding:20px 13px}header{align-items:flex-start;flex-direction:column}.stats{grid-template-columns:repeat(3,1fr)}.grid{grid-template-columns:repeat(auto-fill,minmax(155px,1fr))}}
</style></head><body>
<div id="authPanel" class="auth" style="display:none"><div class="eyebrow">Private cloud library</div><h1>Soumendra Archive</h1><p class="muted">Sign in to your personal creations vault.</p><div id="authStatus" class="status"></div><form class="form" id="authForm"><label>Email<input id="email" type="email" required autocomplete="email" placeholder="you@example.com"></label><label>Password<input id="password" type="password" required minlength="6" autocomplete="current-password" placeholder="At least 6 characters"></label><div class="buttons"><button class="btn primary" type="submit" id="signIn">Sign in</button><button class="btn" type="button" id="signUp">Create account</button></div></form></div>
<div id="app" class="layout" style="display:none"><aside class="side"><div class="brand">S<span>.</span> ARCHIVE</div><div class="label">LIBRARY</div><nav class="nav" id="nav"><button class="active" data-cat="All">▦ All creations</button><button data-cat="PDF & Documents">▤ PDFs & documents</button><button data-cat="Projects">▣ Projects</button><button data-cat="YouTube Studio">▶ YouTube Studio</button><button data-cat="Designs">✧ Designs</button><button data-cat="Education">⌑ Education</button><button data-cat="Ideas & Drafts">✎ Ideas & drafts</button><button data-cat="Archive">▱ Archive</button></nav></aside><main><header><div><div class="eyebrow">Your personal workspace</div><h1 class="h1" id="heading">All Creations</h1><div class="muted">One secure place for everything you've made and saved.</div></div><div class="buttons"><button class="btn" id="logout">Sign out</button><button class="btn primary" id="add">＋ Add creation</button></div></header><div id="appStatus" class="status"></div><section class="stats"><div class="stat"><small>Total items</small><strong id="count">0</strong></div><div class="stat"><small>PDFs & documents</small><strong id="pdfCount">0</strong></div><div class="stat"><small>Projects</small><strong id="projectCount">0</strong></div></section><div class="toolbar"><input class="field search" id="search" placeholder="Search titles, descriptions, tags…"><select class="field" id="sort"><option value="new">Recently added</option><option value="old">Oldest first</option><option value="az">Name A–Z</option></select></div><section class="grid" id="grid"></section><div class="footer">Soumendra Archive · Private by default</div></main></div>
<div class="modal" id="modal"><div class="box"><button class="close" id="close">×</button><h2>Add to your archive</h2><div id="modalStatus" class="status"></div><form id="itemForm" class="form"><label>Title<input id="title" required placeholder="Name this creation"></label><div class="row"><label>Category<select id="category"><option>Projects</option><option>PDF & Documents</option><option>YouTube Studio</option><option>Designs</option><option>Education</option><option>Ideas & Drafts</option><option>Archive</option></select></label><label>Tags<input id="tags" placeholder="school, logo, video"></label></div><label>Description<textarea id="description" rows="2" placeholder="Optional notes"></textarea></label><label>File<input id="file" type="file" required></label><div class="buttons"><button type="button" class="btn" id="cancel">Cancel</button><button type="submit" class="btn primary" id="save">Upload and save</button></div></form></div></div>
<script>
// Replace these two values with your Supabase Project URL and anon/public key.
const SUPABASE_URL='https://github.com/sasmitabehera7274-lgtm/soumendra-archive/blob/main/index.html';
const SUPABASE_ANON_KEY='sb_publishable_JW5bfbXTeJ4tlHA57ZPw3w_g-glkT5l';
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
let user=null,items=[],active='All';const $=id=>document.getElementById(id);unction msg(el,text){el.textContent=text;el.classList.add('show')}function clearMsg(el){el.textContent='';el.classList.remove('show')}
function showAuth(){ $('authPanel').style.display='block';$('app').style.display='none'}function showApp(){ $('authPanel').style.display='none';$('app').style.display='flex'}
async function init(){const {data:{session}}=await sb.auth.getSession();if(session){user=session.user;showApp();await loadItems()}else showAuth()}
$('authForm').addEventListener('submit',async e=>{e.preventDefault();clearMsg($('authStatus'));const {error}=await sb.auth.signInWithPassword({email:$('email').value,password:$('password').value});if(error)msg($('authStatus'),error.message);else{const {data:{user:u}}=await sb.auth.getUser();user=u;showApp();await loadItems()}});
$('signUp').onclick=async()=>{clearMsg($('authStatus'));const {data,error}=await sb.auth.signUp({email:$('email').value,password:$('password').value});if(error)msg($('authStatus'),error.message);else msg($('authStatus'),'Account created. Check your email if confirmation is enabled, then sign in.')};
$('logout').onclick=async()=>{await sb.auth.signOut();user=null;items=[];showAuth()};
async function loadItems(){const {data,error}=await sb.from('archive_items').select('*').order('created_at',{ascending:false});if(error){msg($('appStatus'),'Could not load archive: '+error.message);return}clearMsg($('appStatus'));items=data||[];render()}
function icon(x){let t=(x.file_type||'').toLowerCase();if(t.includes('pdf'))return'📕';if(t.includes('image'))return'🖼️';if(t.includes('video'))return'🎬';return'📄'}
function render(){ $('count').textContent=items.length;$('pdfCount').textContent=items.filter(x=>(x.file_type||'').toLowerCase().includes('pdf')).length;$('projectCount').textContent=items.filter(x=>x.category==='Projects').length;$('heading').textContent=active==='All'?'All Creations':active;let q=$('search').value.toLowerCase(),sort=$('sort').value;let arr=items.filter(x=>(active==='All'||x.category===active)&&[x.title,x.description,x.tags,x.category].join(' ').toLowerCase().includes(q));if(sort==='old')arr.sort((a,b)=>new Date(a.created_at)-new Date(b.created_at));if(sort==='az')arr.sort((a,b)=>a.title.localeCompare(b.title));if(sort==='new')arr.sort((a,b)=>new Date(b.created_at)-new Date(a.created_at));let grid=$('grid');grid.innerHTML='';if(!arr.length){grid.innerHTML='<div class="empty"><div style="font-size:35px">✦</div><h3>Your archive starts here</h3><p>Add your first file to your private cloud library.</p><button class="btn primary" onclick="openModal()">＋ Add creation</button></div>';return}arr.forEach(x=>{let c=document.createElement('article');c.className='card';c.innerHTML=`<div class="icon">${icon(x)}</div><h3></h3><p></p><div class="bottom"><span class="tag"></span><div class="card-actions"><button class="open" title="Download">↧</button><button class="delete" title="Delete">×</button></div></div>`;c.querySelector('h3').textContent=x.title;c.querySelector('p').textContent=x.description||x.file_name||'Saved in cloud archive';c.querySelector('.tag').textContent=x.category;c.querySelector('.open').onclick=()=>downloadItem(x);c.querySelector('.delete').onclick=()=>deleteItem(x);grid.appendChild(c)})}
async function downloadItem(x){const {data,error}=await sb.storage.from('archive-files').createSignedUrl(x.file_path,60);if(error){alert('Download link error: '+error.message);return}window.open(data.signedUrl,'_blank')}
async function deleteItem(x){if(!confirm('Delete this file and its archive record?'))return;const {error:storageError}=await sb.storage.from('archive-files').remove([x.file_path]);if(storageError){alert('File delete failed: '+storageError.message);return}const {error}=await sb.from('archive_items').delete().eq('id',x.id);if(error){alert('Record delete failed: '+error.message);return}await loadItems()}
function openModal(){ $('modal').classList.add('show');$('itemForm').reset();clearMsg($('modalStatus'))}function closeModal(){$('modal').classList.remove('show')}$('add').onclick=openModal;$('close').onclick=$('cancel').onclick=closeModal;$('search').oninput=render;$('sort').onchange=render;$('nav').onclick=e=>{let b=e.target.closest('button[data-cat]');if(!b)return;active=b.dataset.cat;document.querySelectorAll('#nav button').forEach(x=>x.classList.toggle('active',x===b));render()};
$('itemForm').onsubmit=async e=>{e.preventDefault();clearMsg($('modalStatus'));const f=$('file').files[0];if(!f)return; if(f.size>50*1024*1024){msg($('modalStatus'),'This file exceeds the current 50 MB bucket limit.');return} $('save').disabled=true;$('save').textContent='Uploading…';try{const path=`${user.id}/${crypto.randomUUID()}-${f.name.replace(/[^a-zA-Z0-9._-]/g,'_')}`;const {error:upErr}=await sb.storage.from('archive-files').upload(path,f,{contentType:f.type||'application/octet-stream',upsert:false});if(upErr)throw upErr;const payload={title:$('title').value,category:$('category').value,description:$('description').value||null,tags:$('tags').value||null,file_name:f.name,file_path:path,file_type:f.type||'application/octet-stream',file_size:f.size};const {error:dbErr}=await sb.from('archive_items').insert(payload);if(dbErr){await sb.storage.from('archive-files').remove([path]);throw dbErr}closeModal();await loadItems()}catch(err){msg($('modalStatus'),err.message||'Upload failed')}finally{$('save').disabled=false;$('save').textContent='Upload and save'}};
sb.auth.onAuthStateChange((_event,session)=>{if(!session){user=null;showAuth()}else user=session.user});init();
</script></body></html>
